name: homebridge
services:
  app:
    image: oznu/homebridge:2023-01-08
    restart: unless-stopped
    environment:
      PGID: $PGID
      PUID: $PUID
      ENABLE_AVAHI: 1
      TZ: $TZ
    network_mode: host
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /homebridge
x-casaos:
  id: com.wisdomsky.coolstore.homebridge
  main: app
  index: /
  port_map: "8581"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.homebridge/assets/icon.png
  title: Homebridge
  version: "2023-01-08"
