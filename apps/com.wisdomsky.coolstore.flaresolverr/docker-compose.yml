name: flaresolverr
services:
  app:
    image: flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: false
      PROMETHEUS_ENABLED: false
      CAPTCHA_SOLVER: none
      PORT: 8191
      PROMETHEUS_PORT: 8192
      TZ: $TZ
    ports:
      - target: 8191
        published: 8191
        protocol: tcp
      - target: 8192
        published: 8192
        protocol: tcp
x-casaos:
  id: com.wisdomsky.coolstore.flaresolverr
  main: app
  index: /
  port_map: "8191"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.flaresolverr/assets/icon.png
  title: FlareSolverr
  version: 3.5.2
