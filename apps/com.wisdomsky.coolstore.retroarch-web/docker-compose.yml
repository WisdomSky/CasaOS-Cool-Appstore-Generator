name: retroarch-web
services:
  app:
    image: inglebard/retroarch-web:latest
    restart: unless-stopped
    environment:
      ROOT_WWW_PATH: /var/www/html
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
x-casaos:
  id: com.wisdomsky.coolstore.retroarch-web
  main: app
  index: /
  port_map: "8080"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.retroarch-web/assets/icon.png
  title: RetroArch-web
  version: latest
