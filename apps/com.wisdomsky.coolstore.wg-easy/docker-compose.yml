name: wg-easy
services:
  app:
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    environment:
      WG_HOST: 0.0.0.0
      PASSWORD: casaos
      WG_PORT: 51820
      WG_DEFAULT_DNS: 1.1.1.1
      WG_PERSISTENT_KEEPALIVE: 0
      WG_MTU: null
    ports:
      - target: 51820
        published: 51820
        protocol: udp
      - target: 51821
        published: 51821
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/wireguard
        target: /etc/wireguard
    cap_add:
      - SYS_MODULE
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
x-casaos:
  id: com.wisdomsky.coolstore.wg-easy
  main: app
  index: /
  port_map: "51821"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.wg-easy/assets/icon.png
  title: Wireguard Server
  version: 15.5.0
