name: playit-docker-web
services:
  playit:
    image: wisdomsky/playit-docker-web:1.1.0
    restart: unless-stopped
    network_mode: host
    ports:
      - target: 8008
        published: "8008"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/playit-docker-web/config
        target: /config
x-casaos:
  id: com.wisdomsky.coolstore.playit-docker-web
  main: playit
  index: /
  port_map: "8008"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.playit-docker-web/assets/icon.png
  title: Playit.gg
  version: 1.1.0
