name: spot-dl
services:
  app:
    image: spotdl/spotify-downloader:v4.6.0
    restart: unless-stopped
    ports:
      - target: 8800
        published: 8800
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Media/Music
        target: /music
      - type: bind
        source: /DATA/AppData/coolstore-spotdl/config
        target: /config
    command:
      - web
      - "--host"
      - 0.0.0.0
      - "--port"
      - "8800"
      - "--web-use-output-dir"
    tty: true
x-casaos:
  id: com.wisdomsky.coolstore.spot-dl
  main: app
  index: /
  port_map: "8800"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.spot-dl/assets/icon.svg
  title: spotDL
  version: 4.6.0
