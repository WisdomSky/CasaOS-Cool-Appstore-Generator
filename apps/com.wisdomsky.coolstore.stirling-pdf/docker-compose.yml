name: stirling-pdf
services:
  app:
    image: frooodle/s-pdf:3.2.2
    restart: unless-stopped
    environment:
      APP_HOME_NAME: Stirling PDF
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
x-casaos:
  id: com.wisdomsky.coolstore.stirling-pdf
  main: app
  index: /
  port_map: "8080"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.stirling-pdf/assets/icon.png
  title: Stirling PDF
  version: 3.2.2
