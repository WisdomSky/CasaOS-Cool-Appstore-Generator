name: ghost
services:
  app:
    image: ghost:6.73.0
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: casaos
      database__connection__password: casaos
      database__connection__database: casaos
    ports:
      - target: 2368
        published: 2368
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/content
        target: /var/lib/ghost/content
  db:
    image: mariadb:13.0.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: casaos
      MYSQL_USER: casaos
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/mysql
        target: /var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 3
x-casaos:
  id: com.wisdomsky.coolstore.ghost
  main: app
  index: /
  port_map: "2368"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.ghost/assets/icon.png
  title: Ghost
  version: 6.73.0
