name: metube-youtubedl
services:
  app:
    image: alexta69/metube:2025-07-30
    restart: unless-stopped
    environment:
      UID: $PUID
      GID: $PGID
      DARK_MODE: true
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
x-casaos:
  id: com.wisdomsky.coolstore.metube-youtubedl
  main: app
  index: /
  port_map: "8081"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.metube-youtubedl/assets/icon.png
  title: Metube
  version: "2025-07-30"
