name: magicmirror
services:
  app:
    image: karsten13/magicmirror:alpine-v2.38.0
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/magicmirror/config
        target: /opt/magic_mirror/config
x-casaos:
  id: com.wisdomsky.coolstore.magicmirror
  main: app
  index: /
  port_map: "8080"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.magicmirror/assets/icon.svg
  title: MagicMirror²
  version: 2.38.0
