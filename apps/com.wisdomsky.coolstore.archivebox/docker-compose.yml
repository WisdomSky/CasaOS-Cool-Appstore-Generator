name: archivebox
services:
  app:
    image: archivebox/archivebox:0.9.77
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: "*"
      MEDIA_MAX_SIZE: 500m
      PUBLIC_INDEX: true
      PUBLIC_SNAPSHOTS: true
      PUBLIC_ADD_VIEW: true
    ports:
      - target: 8000
        published: 8002
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
x-casaos:
  id: com.wisdomsky.coolstore.archivebox
  main: app
  index: /
  port_map: "8002"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.archivebox/assets/icon.png
  title: Archivebox
  version: 0.9.77
