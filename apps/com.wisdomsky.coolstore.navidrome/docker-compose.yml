name: coolstore-navidrome
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - type: bind
        source: /DATA/AppData/coolstore-navidrome/data
        target: /data
      - type: bind
        source: /DATA/Media/Music
        target: /music
        read_only: true
x-casaos:
  id: com.wisdomsky.coolstore.navidrome
  main: navidrome
  index: /
  port_map: "4533"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Cool-Appstore-Generator@gh-pages/apps/com.wisdomsky.coolstore.navidrome/assets/icon.jpg
  title: Navidrome
  version: 0.64.2
